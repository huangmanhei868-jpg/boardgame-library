，赛后不能再用。第一场使用普通赛道，后面交替使用特殊赛道。","turn":"每一场同时亮出角色，确定先手。轮到你时先检查“移动前”技能，再掷骰做主要移动；移动时处理超越、停格、摔倒等效果，依照卡面处理强制与可选能力。第一名到达终点后比赛继续，第二名到达时结束本场。","example":"例：香蕉站在第 6 格，兔子从第 4 格移到第 8 格，因为超越香蕉，兔子触发香蕉的摔倒效果。四场比完，把获得的积分片数字相加，最高者胜。","pitfalls":"主移动、传送、额外移动是不同概念；技能中“经过”和“停在”也不同；名次积分以盒内积分片为准。"},"minPlayers":2,"maxPlayers":6,"diagram":[["先选 4 人","蛇形选人，每场派一个未使用的角色"],["掷骰前","检查“移动前”的可选与强制技能"],["移动中","判定是否超越、经过或跳跃格子"],["落点后","执行停格能力、赛道效果和额外移动"],["两人冲线","领取该场奖牌，下一场换角色"]],"official":"https://www.cmyk.games/products/magical-athlete","teach":[["开局前逐项确认","放好赛道、骰子、积分片与棋子。标准模式进行蛇形选秀，每人挑选四名角色；每场仅派一人，赛后不能再用。第一场使用普通赛道，后面交替使用特殊赛道。"],["轮到自己如何行动","每一场同时亮出角色，确定先手。轮到你时先检查“移动前”技能，再掷骰做主要移动；移动时处理超越、停格、摔倒等效果，依照卡面处理强制与可选能力。第一名到达终点后比赛继续，第二名到达时结束本场。"],["照着演练一个情境","例：香蕉站在第 6 格，兔子从第 4 格移到第 8 格，因为超越香蕉，兔子触发香蕉的摔倒效果。四场比完，把获得的积分片数字相加，最高者胜。"],["遇到疑问先检查","主移动、传送、额外移动是不同概念；技能中“经过”和“停在”也不同；名次积分以盒内积分片为准。"]]},{"name":"拉密","en":"Rummikub","icon":"🔢","cat":"牌类","players":"2–4 人","goal":"率先把自己架子上的数字牌全部打出去。","steps":["每人拿 14 张牌，其他牌朝下作牌库。","首次出牌必须用自己牌组成总点数至少 30 的合法组合。","合法组合：同色连续数字至少 3 张，或不同颜色同数字至少 3 张。","通过重组桌面已有组合，出掉自己的牌；不能留下不合法组合。","无法出牌则摸牌，先出完者胜。"],"tips":"万能牌可以替代数字牌，但取回和重组要遵守版本规则。","roles":[],"verified":true,"lesson":{"setup":"将数字牌洗匀扣在桌上。每人抽 14 张排在自己的牌架，剩下的作摸牌堆；确定先手。","turn":"每回合可以从牌架打出合法组合。顺子：同一种颜色连续三个及以上数字，如红 4、5、6；组：同数字、不同颜色的三张或四张，如蓝 8、红 8、黑 8。你的首次下牌必须全用自己牌，点数总和至少 30。完成首次下牌后，才可以拆分和改组桌面组合；回合结束时桌上每组都必须合法。不能出则摸一张牌并结束回合。","example":"例：桌上有红 4、5、6，你有红 7，完成开局后可以加上红 7；但不能留下只有红 4、5 的两张不完整顺子。某玩家出完牌即结束，其他人按手中剩余牌计罚分。","pitfalls":"不要把“至少 30 点首次下牌”误解为以后每回合都要 30 点。万能牌的取回条件与罚分请依版本核对。"},"minPlayers":2,"maxPlayers":4,"diagram":[["摸 14 张","每人牌架 14 张"],["首次下牌","只能使用自己牌架，合计至少 30 点"],["后续回合","可拆分及重组桌面牌，但结束时全部合法"],["不能出牌","摸 1 张结束"],["先出完","计算其他玩家手牌罚分"]],"official":"https://www.rummikub.com/","teach":[["开局前逐项确认","将数字牌洗匀扣在桌上。每人抽 14 张排在自己的牌架，剩下的作摸牌堆；确定先手。"],["轮到自己如何行动","每回合可以从牌架打出合法组合。顺子：同一种颜色连续三个及以上数字，如红 4、5、6；组：同数字、不同颜色的三张或四张，如蓝 8、红 8、黑 8。你的首次下牌必须全用自己牌，点数总和至少 30。完成首次下牌后，才可以拆分和改组桌面组合；回合结束时桌上每组都必须合法。不能出则摸一张牌并结束回合。"],["照着演练一个情境","例：桌上有红 4、5、6，你有红 7，完成开局后可以加上红 7；但不能留下只有红 4、5 的两张不完整顺子。某玩家出完牌即结束，其他人按手中剩余牌计罚分。"],["遇到疑问先检查","不要把“至少 30 点首次下牌”误解为以后每回合都要 30 点。万能牌的取回条件与罚分请依版本核对。"]]},{"name":"卡坦岛","en":"Catan","icon":"🏝️","cat":"策略","players":"3–4 人","goal":"第一个达到 10 胜利点的玩家获胜。","steps":["每人放置初始村庄和道路，并拿到对应的起始资源。","回合开始掷 2 个骰子：对应数字的地块产出资源。","与其他玩家交易，或按港口/银行比例换资源。","花资源建道路、村庄、城市或发展卡。","率先达到胜利点要求即获胜。"],"tips":"掷到 7 会触发强盗；村庄与城市之间有距离规则。","roles":[],"verified":true,"lesson":{"setup":"按版图放六角资源地块、数字标记、沙漠和强盗。每人依规定顺序在六角交点放两座起始村庄，并沿边放道路；第二座起始村庄附近的资源按规则领取。","turn":"轮到你先投两个骰子。除掷 7 之外，所有紧邻所掷数字地块的村庄各拿该地块资源 1 张，城市拿 2 张；交易资源，再付费建道路、村庄、升级城市或购买发展卡。道路占边，村庄占交点，相邻村庄间至少隔两个边。掷 7 时超过手牌上限的人弃一半（向下取整），移动强盗并可抽取相邻玩家资源。","example":"例：骰子总和 8，紧挨标着 8 的森林的你有一座村庄，就拿 1 张木材；若那里是城市则拿 2 张。自己回合达到 10 胜利点即获胜，发展卡和奖励分也可能计分。","pitfalls":"常见资源成本：道路=木+砖；村庄=木+砖+羊+麦；城市=3矿+2麦；发展卡=矿+羊+麦。扩展玩法人数和卡片规则可能不同。"},"minPlayers":3,"maxPlayers":4,"diagram":[["掷两颗骰子","所有玩家按地块数字领取资源"],["7 点例外","处理弃牌、移动强盗及抢资源"],["自由交易","和玩家或银行兑换资源"],["支付建造","道路 / 村庄 / 城市 / 发展卡"],["达到 10 分","当前玩家符合胜利条件即可获胜"]],"official":"https://www.catan.com/catan","teach":[["开局前逐项确认","按版图放六角资源地块、数字标记、沙漠和强盗。每人依规定顺序在六角交点放两座起始村庄，并沿边放道路；第二座起始村庄附近的资源按规则领取。"],["轮到自己如何行动","轮到你先投两个骰子。除掷 7 之外，所有紧邻所掷数字地块的村庄各拿该地块资源 1 张，城市拿 2 张；交易资源，再付费建道路、村庄、升级城市或购买发展卡。道路占边，村庄占交点，相邻村庄间至少隔两个边。掷 7 时超过手牌上限的人弃一半（向下取整），移动强盗并可抽取相邻玩家资源。"],["照着演练一个情境","例：骰子总和 8，紧挨标着 8 的森林的你有一座村庄，就拿 1 张木材；若那里是城市则拿 2 张。自己回合达到 10 胜利点即获胜，发展卡和奖励分也可能计分。"],["遇到疑问先检查","常见资源成本：道路=木+砖；村庄=木+砖+羊+麦；城市=3矿+2麦；发展卡=矿+羊+麦。扩展玩法人数和卡片规则可能不同。"]]},{"name":"璀璨宝石","en":"Splendor","icon":"💎","cat":"策略","players":"2–4 人","goal":"积累声望，触发结束条件后最高分获胜。","steps":["轮到你时：拿宝石筹码、买一张发展卡，或预留一张卡，三选一。","发展卡提供永久折扣颜色，有些还附声望分数。","符合贵族拜访条件时，可取得相应贵族板块。","有人达到 15 分后完成该轮，比较得分。"],"tips":"一般最多持有 10 枚宝石筹码；金色可作万能资源。","roles":[],"verified":true,"lesson":{"setup":"将一级、二级、三级发展牌分开洗，分别翻开 4 张；按人数放好贵族板块、五色宝石筹码和金色万能筹码。","turn":"你的一个回合只选一种主要动作：取 3 种不同颜色各 1 枚筹码；或者在该颜色库存至少 4 枚时取同色 2 枚；或者购买一张公开或预留卡；或者预留一张牌并尽可能拿一个金色筹码。已买发展卡右上角的颜色是永久折扣，每次购买都可使用。回合末检查是否有贵族符合要求，符合即可获得对应分数。","example":"例：一张卡原价要红 2、蓝 1，你有两张红色折扣卡，就只需付蓝色筹码 1 枚。有人达到 15 分后，当前轮让大家行动次数相同，最高分赢。","pitfalls":"筹码持有上限通常是 10；预留卡通常最多 3 张；金筹码是万能筹码，不是永久折扣。"},"minPlayers":2,"maxPlayers":4,"diagram":[["公开牌列","每等级翻开 4 张"],["四选一动作","拿宝石、购买卡、预留卡"],["核算折扣","已购卡的宝石图标永久减费"],["检查贵族","满足需求可到访"],["15 分触发","完成同轮次数后结算"]],"official":"https://www.spacecowboys.fr/splendor-en","teach":[["开局前逐项确认","将一级、二级、三级发展牌分开洗，分别翻开 4 张；按人数放好贵族板块、五色宝石筹码和金色万能筹码。"],["轮到自己如何行动","你的一个回合只选一种主要动作：取 3 种不同颜色各 1 枚筹码；或者在该颜色库存至少 4 枚时取同色 2 枚；或者购买一张公开或预留卡；或者预留一张牌并尽可能拿一个金色筹码。已买发展卡右上角的颜色是永久折扣，每次购买都可使用。回合末检查是否有贵族符合要求，符合即可获得对应分数。"],["照着演练一个情境","例：一张卡原价要红 2、蓝 1，你有两张红色折扣卡，就只需付蓝色筹码 1 枚。有人达到 15 分后，当前轮让大家行动次数相同，最高分赢。"],["遇到疑问先检查","筹码持有上限通常是 10；预留卡通常最多 3 张；金筹码是万能筹码，不是永久折扣。"]]},{"name":"卡卡颂","en":"Carcassonne","icon":"🏰","cat":"拼图","players":"2–5 人","goal":"通过道路、城市、修道院和农田得分。","steps":["每回合翻一块地形板，必须与邻接地形接得上。","可选择放一个米宝到刚放的地块上的合法位置。","完成道路、城市或修道院时计分，通常收回米宝。","所有地块用完后进行农田与未完成建筑计分。"],"tips":"同一连通地形上，通常不能直接放第二个米宝。","roles":[],"verified":true,"lesson":{"setup":"以起始板块开局，将其他板块洗匀背面朝下，每人拿一种颜色的米宝。","turn":"每回合按顺序做三件事：抽一块板块；沿边放到地图上，使相接边的路接路、城接城、草地接草地；可以选择在刚放的板块上放 1 个自己的米宝（要求它所连的区域当前没人占领）。随后对本回合完成的区域即时计分，并收回相应米宝。","example":"例：一条路从岔口延伸到城市、两端封闭完成，总共 4 块板块且只有你的米宝，就按道路计分。地块全用完后再算农田与未完成区域，最高分获胜。","pitfalls":"是否可以放米宝要看“整个连通区域”，不是只看这张板块上有没有棋子。农田分较复杂，建议玩前核对所持版本。"},"minPlayers":2,"maxPlayers":5,"diagram":[["认识配件","查看人数、牌组、棋盘及初始资源"],["摆放准备","按规则分配初始牌和标记"],["行动顺序","按照完整教学步骤执行回合"],["检查结算","触发特殊效果和得分"],["结束判定","达到规则指定的终局条件"]],"teach":[["开局前逐项确认","以起始板块开局，将其他板块洗匀背面朝下，每人拿一种颜色的米宝。"],["轮到自己如何行动","每回合按顺序做三件事：抽一块板块；沿边放到地图上，使相接边的路接路、城接城、草地接草地；可以选择在刚放的板块上放 1 个自己的米宝（要求它所连的区域当前没人占领）。随后对本回合完成的区域即时计分，并收回相应米宝。"],["照着演练一个情境","例：一条路从岔口延伸到城市、两端封闭完成，总共 4 块板块且只有你的米宝，就按道路计分。地块全用完后再算农田与未完成区域，最高分获胜。"],["遇到疑问先检查","是否可以放米宝要看“整个连通区域”，不是只看这张板块上有没有棋子。农田分较复杂，建议玩前核对所持版本。"]]},{"name":"情书","en":"Love Letter","icon":"💌","cat":"推理","players":"2–6 人","goal":"通过多轮赢得足够的好感标记。","steps":["洗牌并秘密移除指定牌，每人拿 1 张手牌。","轮到你时抽 1 张、从两张中打出 1 张并执行效果。","被淘汰的人本轮不再行动。","牌堆用完后仍在场的人比手牌点数；剩下唯一玩家则直接赢该轮。"],"tips":"具体牌名和张数随版本不同；按盒内牌上技能为准。","roles":[["卫兵 Guard","猜测别人的手牌牌名，猜中则对方出局（不能猜卫兵）。"],["牧师 Priest","秘密查看另一名玩家的手牌。"],["男爵 Baron","与另一名玩家私下比较手牌点数，较小者出局。"],["侍女 Handmaid","在下一回合开始前保护自己免受其他玩家牌效果影响。"],["王子 Prince","指定一人弃掉手牌并重新抽牌。"],["国王 King","与另一名玩家交换手牌。"],["伯爵夫人 Countess","与指定较高级别牌同在手中时必须打出。"],["公主 Princess","一旦弃掉或打出，自己立即出局。"]],"verified":true,"lesson":{"setup":"洗匀当版人物卡，每人发 1 张隐藏手牌，并按人数移除指定卡。放好好感标记，确定首位玩家。","turn":"轮到你先摸 1 张牌，此时手中有两张；从中选 1 张公开打出并执行技能，另 1 张留手。有人被淘汰就不再参与本轮；直到牌堆空或只剩一名玩家。","example":"例：打出卫兵，选择一名玩家并猜他握着“国王”；猜对对方淘汰，猜错无事发生。牌堆空时，仍存活者公开手牌，点数最高者赢一枚好感标记。累积到规定数量者赢整局。","pitfalls":"不同版本人物牌、好感目标数量差异很大；尤其《情书》新版多了角色，请以盒内牌文及人数表为准。"},"minPlayers":2,"maxPlayers":6,"diagram":[["认识配件","查看人数、牌组、棋盘及初始资源"],["摆放准备","按规则分配初始牌和标记"],["行动顺序","按照完整教学步骤执行回合"],["检查结算","触发特殊效果和得分"],["结束判定","达到规则指定的终局条件"]],"teach":[["开局前逐项确认","洗匀当版人物卡，每人发 1 张隐藏手牌，并按人数移除指定卡。放好好感标记，确定首位玩家。"],["轮到自己如何行动","轮到你先摸 1 张牌，此时手中有两张；从中选 1 张公开打出并执行技能，另 1 张留手。有人被淘汰就不再参与本轮；直到牌堆空或只剩一名玩家。"],["照着演练一个情境","例：打出卫兵，选择一名玩家并猜他握着“国王”；猜对对方淘汰，猜错无事发生。牌堆空时，仍存活者公开手牌，点数最高者赢一枚好感标记。累积到规定数量者赢整局。"],["遇到疑问先检查","不同版本人物牌、好感目标数量差异很大；尤其《情书》新版多了角色，请以盒内牌文及人数表为准。"]]},{"name":"牛头王","en":"6 nimmt!","icon":"🐂","cat":"牌类","players":"2–10 人","goal":"尽量少吃牛头惩罚分。","steps":["桌上先放 4 排起始数字牌。","每人同时选一张牌盖下并一起翻开。","按数字从小到大依次放入合适的一排末尾。","放到第 6 张时，要拿走该排前 5 张；太小无法接牌也必须收一排。","回合结束计算牛头惩罚，累计最低者胜。"],"tips":"选排要依据比自己数字小、且最接近的排尾牌。","roles":[],"verified":true,"lesson":{"setup":"从数字牌中给每人发 10 张手牌；桌上随机亮出 4 张作为四排的开头。","turn":"每人同时选一张盖下，一起亮牌后从最小数字开始依次安放：必须接到末尾数字比自己小、且差值最小的那一排。每排最多 5 张，放第 6 张的人必须把原来 5 张收作罚分，刚打出的牌成为新排开头。若自己的牌比四排末尾都小，则自选一排收走，把自己的牌放为开头。","example":"例：四排末尾是 12、30、51、77，你打 54，则接在 51 后面。10 回合后数自己收牌上的牛头图标，总罚分最少者赢；也可多轮累计到规定结束点。","pitfalls":"不是看哪一排空位最多，而是看“最接近且小于自己数字”的排尾。罚分看牛头数量，不是卡面数字。"},"minPlayers":2,"maxPlayers":10,"diagram":[["认识配件","查看人数、牌组、棋盘及初始资源"],["摆放准备","按规则分配初始牌和标记"],["行动顺序","按照完整教学步骤执行回合"],["检查结算","触发特殊效果和得分"],["结束判定","达到规则指定的终局条件"]],"teach":[["开局前逐项确认","从数字牌中给每人发 10 张手牌；桌上随机亮出 4 张作为四排的开头。"],["轮到自己如何行动","每人同时选一张盖下，一起亮牌后从最小数字开始依次安放：必须接到末尾数字比自己小、且差值最小的那一排。每排最多 5 张，放第 6 张的人必须把原来 5 张收作罚分，刚打出的牌成为新排开头。若自己的牌比四排末尾都小，则自选一排收走，把自己的牌放为开头。"],["照着演练一个情境","例：四排末尾是 12、30、51、77，你打 54，则接在 51 后面。10 回合后数自己收牌上的牛头图标，总罚分最少者赢；也可多轮累计到规定结束点。"],["遇到疑问先检查","不是看哪一排空位最多，而是看“最接近且小于自己数字”的排尾。罚分看牛头数量，不是卡面数字。"]]},{"name":"爆炸猫","en":"Exploding Kittens","icon":"🐱","cat":"派对","players":"2–5 人","goal":"活到最后，不要被爆炸猫炸出局。","steps":["每人领取起始手牌与拆弹牌，按人数设置牌库。","回合中可以打任意张行动牌，或不打。","结束回合时摸一张牌。","摸到爆炸猫必须用拆弹牌，否则淘汰。","活到最后的玩家获胜。"],"tips":"行动牌按其文字处理；不同版本卡牌数量不同。","roles":[],"verified":true,"lesson":{"setup":"根据人数取出所需爆炸猫、拆弹牌并发起始手牌；混匀行动牌与爆炸猫，组成摸牌堆。","turn":"自己的回合可以先打任意张允许的行动牌，也可以直接结束。通常以“摸一张牌”结束回合；若摸到爆炸猫，则必须亮出拆弹牌来拆弹并按规则偷偷把爆炸猫插回牌堆，否则淘汰。跳过、攻击、洗牌、查看顶牌等行动卡会改变这个流程。","example":"例：你觉得牌堆顶是爆炸猫，先打“查看未来”确认，再用“洗牌”或“跳过”规避风险。最后唯一没被炸掉的人获胜。","pitfalls":"“攻击”会让下家额外承担回合，不能简单理解为你替他摸牌。不同扩展有特殊牌，卡上文字优先。"},"minPlayers":2,"maxPlayers":5,"diagram":[["认识配件","查看人数、牌组、棋盘及初始资源"],["摆放准备","按规则分配初始牌和标记"],["行动顺序","按照完整教学步骤执行回合"],["检查结算","触发特殊效果和得分"],["结束判定","达到规则指定的终局条件"]],"teach":[["开局前逐项确认","根据人数取出所需爆炸猫、拆弹牌并发起始手牌；混匀行动牌与爆炸猫，组成摸牌堆。"],["轮到自己如何行动","自己的回合可以先打任意张允许的行动牌，也可以直接结束。通常以“摸一张牌”结束回合；若摸到爆炸猫，则必须亮出拆弹牌来拆弹并按规则偷偷把爆炸猫插回牌堆，否则淘汰。跳过、攻击、洗牌、查看顶牌等行动卡会改变这个流程。"],["照着演练一个情境","例：你觉得牌堆顶是爆炸猫，先打“查看未来”确认，再用“洗牌”或“跳过”规避风险。最后唯一没被炸掉的人获胜。"],["遇到疑问先检查","“攻击”会让下家额外承担回合，不能简单理解为你替他摸牌。不同扩展有特殊牌，卡上文字优先。"]]},{"name":"诺丁汉警长","en":"Sheriff of Nottingham","icon":"👜","cat":"诈唬","players":"3–6 人","goal":"通过合法贸易、走私及查扣获利最多。","steps":["一名玩家担任警长，其他人把货物秘密装袋。","商人向警长声明袋内的合法货物种类与数量。","可谈判、行贿，说服警长不要检查。","警长选择放行或开袋检查；检查错误/查中走私分别按规则赔偿。","轮流当警长，到规定轮数结束计算总财富。"],"tips":"声明必须符合游戏要求，但袋里可以藏别的货。","roles":[],"verified":true,"lesson":{"setup":"轮流指定一名警长，其余人是商人。每人领取起始金币、货物牌与商人袋。","turn":"商人先调整手牌，把 1–5 张货物放入袋里，向警长声称袋中“全是同一种合法货物”，并报出数量；商人可以撒谎。警长逐个决定放行还是检查，双方可公开谈判贿赂。检查时若全符合声明，警长赔偿商人；如有走私或货物不符，通常没收违规货并收取罚款。","example":"例：你放了 2 苹果＋1 胡椒，却宣称“3 个苹果”，这是允许的说谎；警长是否开袋由其决定。轮流当足警长后，将金币、合法货物等结算为总分。","pitfalls":"商品价值、罚款、国王/王后奖励及轮数受版本影响；不要把“放进去的牌数”也说谎。"},"minPlayers":3,"maxPlayers":6,"diagram":[["认识配件","查看人数、牌组、棋盘及初始资源"],["摆放准备","按规则分配初始牌和标记"],["行动顺序","按照完整教学步骤执行回合"],["检查结算","触发特殊效果和得分"],["结束判定","达到规则指定的终局条件"]],"teach":[["开局前逐项确认","轮流指定一名警长，其余人是商人。每人领取起始金币、货物牌与商人袋。"],["轮到自己如何行动","商人先调整手牌，把 1–5 张货物放入袋里，向警长声称袋中“全是同一种合法货物”，并报出数量；商人可以撒谎。警长逐个决定放行还是检查，双方可公开谈判贿赂。检查时若全符合声明，警长赔偿商人；如有走私或货物不符，通常没收违规货并收取罚款。"],["照着演练一个情境","例：你放了 2 苹果＋1 胡椒，却宣称“3 个苹果”，这是允许的说谎；警长是否开袋由其决定。轮流当足警长后，将金币、合法货物等结算为总分。"],["遇到疑问先检查","商品价值、罚款、国王/王后奖励及轮数受版本影响；不要把“放进去的牌数”也说谎。"]]},{"name":"矮人掘金","en":"Saboteur","icon":"⛏️","cat":"身份","players":"3–10 人","goal":"好矮人找黄金，坏矮人阻挠路线。","steps":["随机发秘密身份：矿工或捣蛋鬼。","轮流放路线牌、行动牌，或弃牌。","线路必须按路径规则连接到起点。","到达黄金目标或牌耗尽时，一轮结束。","多轮后按得到的金块计分。"],"tips":"坏矮人会破坏工具、挡路；具体身份人数取决于人数。","roles":[],"verified":true,"lesson":{"setup":"将起点和三张背面朝下的目标牌按规定间距摆开，混入身份卡并秘密分配矿工/捣蛋鬼。每人获得手牌。","turn":"轮到你从以下三种行动选一：打路径卡延长起点通往目标的道路；打行动卡，例如损坏或修复工具、查看目标、拆路径；或弃掉一张牌。行动之后按规则摸牌。路径卡的通道必须与相邻卡连通，且从起点能到达。","example":"例：队友的矿灯坏了，就可能无法放路牌；修复行动牌后才能继续铺路。连通金矿或手牌耗尽后该轮结束，各阵营根据结果分黄金。规定轮数后黄金价值最高者赢。","pitfalls":"身份是秘密的；路径必须逻辑相连，不是把牌简单摆在目标方向就行。人数决定间谍数量。"},"minPlayers":3,"maxPlayers":10,"diagram":[["认识配件","查看人数、牌组、棋盘及初始资源"],["摆放准备","按规则分配初始牌和标记"],["行动顺序","按照完整教学步骤执行回合"],["检查结算","触发特殊效果和得分"],["结束判定","达到规则指定的终局条件"]],"teach":[["开局前逐项确认","将起点和三张背面朝下的目标牌按规定间距摆开，混入身份卡并秘密分配矿工/捣蛋鬼。每人获得手牌。"],["轮到自己如何行动","轮到你从以下三种行动选一：打路径卡延长起点通往目标的道路；打行动卡，例如损坏或修复工具、查看目标、拆路径；或弃掉一张牌。行动之后按规则摸牌。路径卡的通道必须与相邻卡连通，且从起点能到达。"],["照着演练一个情境","例：队友的矿灯坏了，就可能无法放路牌；修复行动牌后才能继续铺路。连通金矿或手牌耗尽后该轮结束，各阵营根据结果分黄金。规定轮数后黄金价值最高者赢。"],["遇到疑问先检查","身份是秘密的；路径必须逻辑相连，不是把牌简单摆在目标方向就行。人数决定间谍数量。"]]},{"name":"犯罪现场","en":"Deception: Murder in Hong Kong","icon":"🔎","cat":"推理","players":"4–12 人","goal":"调查员找出凶手的关键证物与凶器。","steps":["秘密分配身份：法医、凶手、调查员及可能的其他身份。","凶手秘密指定自己面前的一张证物和一张凶器。","法医不能说话提示，只能使用场景提示板给线索。","其他玩家讨论并尝试指认玩家、证物和凶器。","根据是否成功破案决定阵营胜负。"],"tips":"不同人数使用的帮凶、目击者等身份可能不同。","roles":[["法医 Forensic Scientist","知道案件答案，用场景板和指示物给线索，不可随意口头提示。"],["凶手 Murderer","秘密选出关键证物和凶器，避免暴露。"],["帮凶 Accomplice","帮助凶手误导调查。"],["目击者 Witness","知道涉案身份线索，但必须避免被凶手识破。"]],"verified":true,"lesson":{"setup":"准备线索卡、物证卡和身份牌。每个玩家面前亮放多张线索/物证，法医得到答案并保密。","turn":"凶手在不让调查员看到的情况下指出自己的一张凶器和一张关键证物。法医不能公开说答案，而是在现场提示板上用标记表达伤势、地点或动机等线索。调查员可边讨论边推理，依规则拥有提出一次完整指认的机会。","example":"例：法医提示“严重出血”“厨房”，大家要找最可能的杀人凶器和关键证物，并同时说对玩家、凶器和证物才算破案成功。","pitfalls":"玩家人数会决定是否加入帮凶/目击者等身份，指认次数和胜负有细则；适用具体版本规则。"},"minPlayers":4,"maxPlayers":12,"diagram":[["认识配件","查看人数、牌组、棋盘及初始资源"],["摆放准备","按规则分配初始牌和标记"],["行动顺序","按照完整教学步骤执行回合"],["检查结算","触发特殊效果和得分"],["结束判定","达到规则指定的终局条件"]],"teach":[["开局前逐项确认","准备线索卡、物证卡和身份牌。每个玩家面前亮放多张线索/物证，法医得到答案并保密。"],["轮到自己如何行动","凶手在不让调查员看到的情况下指出自己的一张凶器和一张关键证物。法医不能公开说答案，而是在现场提示板上用标记表达伤势、地点或动机等线索。调查员可边讨论边推理，依规则拥有提出一次完整指认的机会。"],["照着演练一个情境","例：法医提示“严重出血”“厨房”，大家要找最可能的杀人凶器和关键证物，并同时说对玩家、凶器和证物才算破案成功。"],["遇到疑问先检查","玩家人数会决定是否加入帮凶/目击者等身份，指认次数和胜负有细则；适用具体版本规则。"]]},{"name":"荣耀之城","en":"Citadels","icon":"🏙️","cat":"角色","players":"2–8 人","goal":"建造城市并在游戏结束取得最高分。","steps":["每轮暗选不同职业角色，按职业号码顺序行动。","职业提供不同技能，例如刺客阻止一人行动。","轮到你时先拿金币或抽建筑牌，再可建造建筑。","达到该版规定建筑数量触发结束，统计建筑成本与奖励分。"],"tips":"旧版与新版职业、结束建筑数量不同，应以盒内版本为准。","roles":[["刺客 Assassin","指定一种职业，本轮该职业失去回合。"],["盗贼 Thief","指定一种职业，偷取该职业本轮的钱。"],["魔术师 Magician","交换手牌或弃牌重抽（依版本）。"],["国王 King","获得王冠与对应建筑收入。"],["主教 Bishop","保护建筑免于军阀拆除。"],["商人 Merchant","额外获得金币及相应建筑收入。"],["建筑师 Architect","多抽牌并可建造更多建筑。"],["军阀 Warlord","可以付费摧毁建筑（受限制）。"]],"verified":true,"lesson":{"setup":"准备人物角色牌、地区建筑牌和金币。每位玩家领取初始金币和建筑牌，按人数确定职业选择规则。","turn":"每轮先暗选人物职业（有时要先弃角色），再由主持者按职业号码依次呼叫。被叫到的职业轮到时先选拿金币或摸建筑牌，然后通常可支付造价建造一座建筑。角色能力可能杀人、偷钱、换牌或加收入，得在对应时机操作。","example":"例：你选“商人”，除了基础经济行动，还能获得额外金币；你选“建筑师”，则可能能在同一回合建设多栋建筑。有人达到该版本要求的建筑数量时触发终局，加总建筑成本和额外分数。","pitfalls":"同一个玩家每轮通常只扮演一名职业，角色行动先后不等于座位顺序。旧版和新版人物数量不同。"},"minPlayers":2,"maxPlayers":8,"diagram":[["认识配件","查看人数、牌组、棋盘及初始资源"],["摆放准备","按规则分配初始牌和标记"],["行动顺序","按照完整教学步骤执行回合"],["检查结算","触发特殊效果和得分"],["结束判定","达到规则指定的终局条件"]],"teach":[["开局前逐项确认","准备人物角色牌、地区建筑牌和金币。每位玩家领取初始金币和建筑牌，按人数确定职业选择规则。"],["轮到自己如何行动","每轮先暗选人物职业（有时要先弃角色），再由主持者按职业号码依次呼叫。被叫到的职业轮到时先选拿金币或摸建筑牌，然后通常可支付造价建造一座建筑。角色能力可能杀人、偷钱、换牌或加收入，得在对应时机操作。"],["照着演练一个情境","例：你选“商人”，除了基础经济行动，还能获得额外金币；你选“建筑师”，则可能能在同一回合建设多栋建筑。有人达到该版本要求的建筑数量时触发终局，加总建筑成本和额外分数。"],["遇到疑问先检查","同一个玩家每轮通常只扮演一名职业，角色行动先后不等于座位顺序。旧版和新版人物数量不同。"]]},{"name":"马戏星探","en":"SCOUT","icon":"🎪","cat":"牌类","players":"2–5 人","goal":"通过组合压过上一手牌，获得分数。","steps":["每人拿好手牌后，整轮不能重新排列手牌顺序。","轮到你时可打出相邻的同数或连续数字组合，压过中央组合。","也可以 SCOUT：从中央组合取一张到手牌指定位置。","每轮有一次特殊 Scout & Show 操作。","当有人清空手牌或一圈没人压过当前出牌者时，轮次结束。"],"tips":"双数字牌可在开局前整体旋转手牌决定朝向。","roles":[],"verified":true,"lesson":{"setup":"把玩家人数对应牌分发完，玩家查看牌后可以整体倒转手牌，但从此不得重新排列手中牌顺序。","turn":"轮到你可以 SHOW：打出相邻的一张或多张牌，组成合法的同点或顺子，用更强组合压过中央牌；或 SCOUT：从中央现有牌列的一端拿 1 张，放到自己手中指定位置，不能随意移动其他手牌。每轮一次 Scout & Show 允许两种动作组合。","example":"例：你手上连续位置有 3、4、5，可以作为三张顺子压过较弱牌组；若打不出去，就从中央拿牌调整下回合组合。有人出完牌或无人能压过上一轮出牌时计分，按轮次累计。","pitfalls":"手牌的左右顺序不能随便调整，这是游戏最重要的限制；同数和顺子的牌型强度有专门比较。"},"minPlayers":2,"maxPlayers":5,"diagram":[["认识配件","查看人数、牌组、棋盘及初始资源"],["摆放准备","按规则分配初始牌和标记"],["行动顺序","按照完整教学步骤执行回合"],["检查结算","触发特殊效果和得分"],["结束判定","达到规则指定的终局条件"]],"teach":[["开局前逐项确认","把玩家人数对应牌分发完，玩家查看牌后可以整体倒转手牌，但从此不得重新排列手中牌顺序。"],["轮到自己如何行动","轮到你可以 SHOW：打出相邻的一张或多张牌，组成合法的同点或顺子，用更强组合压过中央牌；或 SCOUT：从中央现有牌列的一端拿 1 张，放到自己手中指定位置，不能随意移动其他手牌。每轮一次 Scout & Show 允许两种动作组合。"],["照着演练一个情境","例：你手上连续位置有 3、4、5，可以作为三张顺子压过较弱牌组；若打不出去，就从中央拿牌调整下回合组合。有人出完牌或无人能压过上一轮出牌时计分，按轮次累计。"],["遇到疑问先检查","手牌的左右顺序不能随便调整，这是游戏最重要的限制；同数和顺子的牌型强度有专门比较。"]]},{"name":"印加宝藏","en":"Incan Gold / Diamant","icon":"🏺","cat":"冒险","players":"3–8 人","goal":"探险拿宝石，安全带回营地才算入袋。","steps":["所有人同时决定继续深入，或带宝石回营地。","每深入一步翻开新宝藏/危险牌。","新宝石通常由仍探险的人平均分配。","遇到同类危险第二次，全体没撤退者失去本轮未存宝石。","若干轮结束后，已安全储存的宝石最多者胜。"],"tips":"退回营地可以保住本轮收获；特殊宝物的分配看版本。","roles":[],"verified":true,"lesson":{"setup":"准备宝物和危险牌、每人的探险者标记及计分宝石。游戏共若干轮冒险。","turn":"每个探索阶段大家同时决定“继续探索”或“返回营地”。继续的人翻下一张牌，宝石平均分给还在洞穴里的玩家，分不掉的留在路上；退出的人能把临时宝石带回营地。如果出现第二张相同灾难，留下来的人本轮临时获得的宝石全部丢失。","example":"例：三个人继续探索，翻出 8 颗宝石，每人拿 2 颗，余下 2 颗留场；下一轮仅一人撤退，就可能独吞路上剩余宝石。规定轮数后安全存回营地的宝石最多者胜。","pitfalls":"撤退通常同时表态。一次性宝物仅在特定人数退出时可拿，须按版本说明执行。"},"minPlayers":3,"maxPlayers":8,"diagram":[["认识配件","查看人数、牌组、棋盘及初始资源"],["摆放准备","按规则分配初始牌和标记"],["行动顺序","按照完整教学步骤执行回合"],["检查结算","触发特殊效果和得分"],["结束判定","达到规则指定的终局条件"]],"teach":[["开局前逐项确认","准备宝物和危险牌、每人的探险者标记及计分宝石。游戏共若干轮冒险。"],["轮到自己如何行动","每个探索阶段大家同时决定“继续探索”或“返回营地”。继续的人翻下一张牌，宝石平均分给还在洞穴里的玩家，分不掉的留在路上；退出的人能把临时宝石带回营地。如果出现第二张相同灾难，留下来的人本轮临时获得的 和领航员（Navigator），根据人数与相关限制选人；其他玩家可以决定是否亮枪尝试哗变。2【忠诚问题】处理本轮需要的忠诚相关效果、质疑或行动。3【航行】按规则由船长、副手和领航员依次处理航行卡，进行秘密筛选和最终定向；不要把玩家口头宣称当成真实的牌面信息。揭晓最终航向，船前进并触发地图格效果。4【下班】结算特殊事件、轮换船长或职位，并检查胜利条件，然后进入下一轮。","example":"【模拟一轮】6 人开局，A 是船长，选 B 当副手、C 当领航员。其他人讨论是否信任 A；如有人用枪发起哗变，先按人数门槛处理，成功便由新船长重新组队。没有哗变则进入秘密航行：A、B、C 依次按本盒规则筛选航行卡，最后公开被选中的航向，移动船并执行停靠处图标。玩家复盘“谁曾有机会影响航线”，但仅靠最终向西不能确定是谁动了手脚。","pitfalls":"重要：这不是全体船员公开投票选航线；职位能力不同，秘密选牌使玩家不能直接看到所有过程。哗变枪数门槛因人数变化；海盗、邪教与水手的胜利路线不同；某些地图事件会让邪教扩张或触发献祭。不要只凭摘要猜测牌数、特殊图标、职位限制，必须对照官方逐项结算。"},"minPlayers":5,"maxPlayers":11,"teach":[["① 开始前：每位玩家有什么？","船员身分属于秘密信息。角色卡、职位标记及枪械资源是不同东西：身份决定为谁赢，职位决定本轮谁能处理航行牌，枪械用于哗变。首次游玩可以先只讲公开规则，不让任何人展示阵营。"],["② 船长为什么重要？","船长不是一个固定玩家：每轮可以变化。船长任命副手和领航员，这三人共同影响一轮船究竟向哪里移动。其他人要观察他们的言行并建立信任。"],["③ 哗变发生在什么时候？","任命航行团队时，其他船员可秘密展示愿意投入的枪械。人数门槛达到后触发哗变，由规则指定的新船长接手。5–7 人需至少 3 把枪，8–9 人至少 4 把，10–11 人至少 5 把；仍须结合盒内细则处理胜出者和平局。"],["④ 秘密航行怎么理解？","航行不是“大家选左还是右”。航行牌在三个岗位之间通过牌面筛选，最后只公开最终航向。由于中途可藏牌或丢牌，其他玩家只能通过行为和结果推断嫌疑。具体每个岗位抽几张、保留几张，按英文原书所示步骤执行。"],["⑤ 船动了后还要做什么？","船的方向决定会落到哪个地图格；先结算地图格说明的效果，再进入清理与交棒。部分效果包含搜索、禁言、宗教仪式等，不要在船刚移动后立刻跳到新一轮。"],["⑥ 什么时候算赢？","忠诚水手想把船带到蓝色港湾，海盗想带到红色海湾；邪教另有驶向克拉肯和献祭的条件。达成任一阵营的正式终局条件立刻按规则宣布结果。"]],"official":"https://funtails.de/en/feed-the-kraken/","manual":"https://funtails.de/wp-content/uploads/2021/12/Rules_FtK_21-06-01_V01_EN_Compressed.pdf","diagram":["船长任命副手与领航员","船员亮枪 / 哗变","秘密航行牌决定航向","移动船只 / 执行地图","清理并检查胜利"]},{"name":"7连翻","en":"Flip 7","icon":"🃏","cat":"派对","players":"3–18 人","goal":"多轮累积分数，争取先达目标分。","steps":["轮到你时决定继续抽牌，还是停手保存本轮分数。","每抽出一张不同数字牌，暂时累积更多分数。","如果重复抽到自己已有数字，则本轮爆掉、不得分。","特殊牌可改变抽牌与计分。","先达到规定总分的玩家触发结束。"],"tips":"如果集齐 7 种不同数字，会有额外奖励。","roles":[],"verified":true,"lesson":{"setup":"洗好数字牌与特殊牌并发起始分数记录。所有玩家在同一轮逐个决定是否继续抽。","turn":"轮到你选择 HIT 继续翻牌，或 STAY 停手保存本轮分数。数字牌保留在自己面前，如果翻到你这一轮已有的数字就爆掉、本轮数字分通常归零。特殊行动牌和倍率牌按其上文字执行；完成 7 个不同数字可能直接触发额外奖金。","example":"例：你面前已有 2、5、8，若再翻 5 就爆；若选择停手可安全计入 2+5+8 的分数（另加符合条件的加成）。达到目标总分触发终局，最高分获胜。","pitfalls":"数字牌不一定每个数字数量一样；特殊牌的“是否当作重复数字”按卡面说明。"},"minPlayers":3,"maxPlayers":18,"diagram":[["认识配件","查看人数、牌组、棋盘及初始资源"],["摆放准备","按规则分配初始牌和标记"],["行动顺序","按照完整教学步骤执行回合"],["检查结算","触发特殊效果和得分"],["结束判定","达到规则指定的终局条件"]],"teach":[["开局前逐项确认","洗好数字牌与特殊牌并发起始分数记录。所有玩家在同一轮逐个决定是否继续抽。"],["轮到自己如何行动","轮到你选择 HIT 继续翻牌，或 STAY 停手保存本轮分数。数字牌保留在自己面前，如果翻到你这一轮已有的数字就爆掉、本轮数字分通常归零。特殊行动牌和倍率牌按其上文字执行；完成 7 个不同数字可能直接触发额外奖金。"],["照着演练一个情境","例：你面前已有 2、5、8，若再翻 5 就爆；若选择停手可安全计入 2+5+8 的分数（另加符合条件的加成）。达到目标总分触发终局，最高分获胜。"],["遇到疑问先检查","数字牌不一定每个数字数量一样；特殊牌的“是否当作重复数字”按卡面说明。"]]},{"name":"初创公司","en":"Startups","icon":"🚀","cat":"牌类","players":"3–7 人","goal":"投资公司并在结算中赚取最多分。","steps":["玩家持有不同颜色的公司股票卡。","轮流打出一张牌，再从牌堆或公开市场补一张。","投资较多者可控制一家公司，并影响谁可以拿市场上的牌。","牌堆结束后依据投资数量与投资者之间的关系结算。"],"tips":"根据 Oink Games 版的主要概念概述，详细结算请看牌盒说明。","roles":[],"verified":false,"lesson":{"setup":"按人数取出公司颜色股票牌、反垄断标记与筹码；每人拿初始股票卡，剩余牌组成牌库。","turn":"轮到你先从手中打出一张卡，放在自己面前作为该公司的投资，或公开弃到市场。然后从牌库或市场补牌。拥有某公司最多公开投资的玩家可取得该公司控制标记，这将限制自己取得某些市场股票。牌堆耗尽后根据各色公司股份比较并结算收益。","example":"例：你公开持有某家公司最多股票，因此可影响该公司在市场中的流通。","pitfalls":"⚠️ 这款的股票分布、控制标记取放与结算金币数值尚未核对，建议对照 Oink Games 规则书。"},"minPlayers":3,"maxPlayers":7,"diagram":[["认识配件","查看人数、牌组、棋盘及初始资源"],["摆放准备","按规则分配初始牌和标记"],["行动顺序","按照完整教学步骤执行回合"],["检查结算","触发特殊效果和得分"],["结束判定","达到规则指定的终局条件"]],"teach":[["开局前逐项确认","按人数取出公司颜色股票牌、反垄断标记与筹码；每人拿初始股票卡，剩余牌组成牌库。"],["轮到自己如何行动","轮到你先从手中打出一张卡，放在自己面前作为该公司的投资，或公开弃到市场。然后从牌库或市场补牌。拥有某公司最多公开投资的玩家可取得该公司控制标记，这将限制自己取得某些市场股票。牌堆耗尽后根据各色公司股份比较并结算收益。"],["照着演练一个情境","例：你公开持有某家公司最多股票，因此可影响该公司在市场中的流通。"],["遇到疑问先检查","⚠️ 这款的股票分布、控制标记取放与结算金币数值尚未核对，建议对照 Oink Games 规则书。"]]},{"name":"摩天大楼","en":"Gotown","icon":"🏢","cat":"牌类","players":"2–4 人","goal":"争夺建筑楼层，让自己的高楼先完成。","steps":["依照手牌逐层建造与争夺摩天大楼。","运用特殊行动牌干扰他人。","达到版本规定条件时决定胜者。"],"tips":"截图为 GoTown，尚缺中文卡牌细节；不建议仅凭这份摘要开局。","roles":[],"verified":false,"lesson":{"setup":"准备楼层牌与功能牌，每位玩家拿手牌，建立中央高楼。","turn":"轮流依牌面规则向楼层堆出牌，目标是让建筑越来越高，并使用特殊牌打断或改变对手计划。","example":"例：当你有合适的楼层牌时可以继续往建筑上叠加；某些特殊牌会改变当前局面。","pitfalls":"⚠️ GoTown 的合法叠楼限制及牌功能尚未核对，当前不能代替官方规则。"},"minPlayers":2,"maxPlayers":4,"diagram":[["认识配件","查看人数、牌组、棋盘及初始资源"],["摆放准备","按规则分配初始牌和标记"],["行动顺序","按照完整教学步骤执行回合"],["检查结算","触发
